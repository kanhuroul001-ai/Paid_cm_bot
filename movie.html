<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090909"><title>Movie details — ClipsMines</title>
<style>
:root{color-scheme:dark;--gold:#e8bd58;--muted:#b7b1a4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#3a2b0d 0,transparent 48%),#090909;color:#f7f3e9;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}header{padding:22px 0;border-bottom:1px solid #ffffff18}.brand,.back{color:var(--gold);text-decoration:none;font-weight:800;letter-spacing:1px}main{padding:26px 0 50px}h1{font-size:clamp(30px,7vw,44px);margin:16px 0}.details{margin:22px 0;padding:18px;border:1px solid #8e713766;border-radius:12px;background:#14120e}.detail-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #ffffff15}.detail-row:last-child{border:0}.detail-row strong{color:var(--gold)}.detail-row span{text-align:right}.download{display:block;margin:20px 0;padding:16px;border-radius:10px;background:var(--gold);color:#171107;font-size:17px;font-weight:800;text-align:center;text-decoration:none}.screenshot-box{min-height:180px;border:1px dashed #8e7137;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;padding:18px;color:#958b77;text-align:center}.ad-slot{min-height:90px;margin:18px 0;border:1px dashed #8e7137;display:flex;align-items:center;justify-content:center;color:#958b77;font-size:12px}.note{font-size:12px;color:#aaa;line-height:1.6}

    .telegram-float{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:1000;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid #e8bd58;border-radius:999px;background:linear-gradient(135deg,#1b170e,#090909);color:#f7f3e9;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.4px;box-shadow:0 8px 28px #000b;transition:transform .2s,border-color .2s}
    .telegram-float:hover{transform:translateY(-2px);border-color:#fff0b8}
    .telegram-float svg{width:20px;height:20px;flex:none;fill:#2aabee}
    @media(max-width:480px){.telegram-float{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));padding:11px 15px;font-size:12px}}
</style></head><body><div class="wrap"><header><a class="brand" href="./index.html">CLIPSMINES</a></header><main><a class="back" href="./index.html">← Back to movies</a><h1 id="title">Loading…</h1><section class="details" id="details"></section><div class="ad-slot">Advertisement space</div><a id="download" class="download" target="_blank" rel="noopener noreferrer">DOWNLOAD HERE</a><h2>Screenshot</h2><div class="screenshot-box">Screenshot space</div><p class="note" id="license"></p><p class="note">Download opens the Wikimedia Commons file page. Use its Original file link to save the movie.</p></main></div><script>
(async()=>{const id=new URLSearchParams(location.search).get("id");try{const r=await fetch("./videos.json");const a=await r.json();const m=a.find(x=>String(x.id)===id);if(!m)throw Error();document.title=m.title+" — ClipsMines";document.getElementById("title").textContent=m.title;const rows=[["Starcast",m.starcast],["Language",m.language],["Release Date",m.year],["Duration",m.duration],["Genre",m.genre],["Size","Varies by file"]];const d=document.getElementById("details");rows.forEach(([k,v])=>{const row=document.createElement("div");row.className="detail-row";const b=document.createElement("strong");b.textContent=k;const s=document.createElement("span");s.textContent=v;row.append(b,s);d.append(row)});document.getElementById("download").href=m.download;document.getElementById("license").textContent=m.license+"; verify the file page and applicable local law before redistribution.";}catch(e){document.getElementById("title").textContent="Movie not found";document.getElementById("download").hidden=true;}})();
</script></body></html>
