<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Clipsmines — Movie catalogue</title>
  <meta name="description" content="Browse the Clipsmines movie catalogue.">
  <style>
    :root { color-scheme: dark; --gold:#e8bd58; --muted:#b7b1a4; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -20%,#3a2b0d 0,transparent 48%),#090909; color:#f7f3e9; font-family:Arial,Helvetica,sans-serif; }
    .wrap { width:min(920px,calc(100% - 36px)); margin:auto; }
    header { display:flex; justify-content:space-between; align-items:center; padding:26px 0; border-bottom:1px solid #ffffff18; }
    .brand { font-size:20px; font-weight:800; letter-spacing:2px; color:var(--gold); }
    .tag { color:var(--muted); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }
    main { padding:76px 0 54px; text-align:center; }
    .eyebrow { color:var(--gold); font-size:12px; font-weight:700; letter-spacing:3px; text-transform:uppercase; }
    h1 { margin:18px 0 14px; font-size:clamp(38px,8vw,68px); line-height:1.02; }
    h1 span { color:var(--gold); }
    .intro { max-width:590px; margin:0 auto; color:var(--muted); font-size:17px; line-height:1.7; }
    .panel { margin:44px auto 0; max-width:760px; padding:30px; border:1px solid #b98c354d; border-radius:18px; background:linear-gradient(145deg,#19150d,#101010 65%); box-shadow:0 18px 60px #0009; text-align:left; }
    .panel h2 { margin:0 0 22px; font-size:23px; text-align:center; }
    .video-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:18px; }
    .video-card { min-width:0; text-align:center; }
    .poster-button { display:block; width:100%; padding:0; border:1px solid #ffffff25; border-radius:12px; overflow:hidden; background:#15120c; cursor:pointer; }
    .poster-button img { display:block; width:100%; aspect-ratio:2/3; object-fit:cover; transition:transform .2s ease; }
    .poster-button:hover img, .poster-button:focus-visible img { transform:scale(1.035); }
    .video-card h3 { margin:12px 0 10px; font-size:17px; }
    .download-wrap { display:none; margin-top:10px; }
    .download-wrap.is-visible { display:block; }
    a.cta { display:inline-block; padding:12px 18px; border-radius:9px; background:var(--gold); color:#171107; font-weight:800; text-decoration:none; white-space:nowrap; }
    a.cta:hover { filter:brightness(1.08); }
    .hint { margin:0; color:var(--muted); font-size:12px; }
    .note { margin:22px auto 0; color:#918a7c; font-size:12px; line-height:1.6; max-width:560px; text-align:center; }
    footer { padding:24px 0 32px; border-top:1px solid #ffffff18; color:#807a70; text-align:center; font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand">CLIPSMINES</div><div class="tag">Movie catalogue</div></header>
    <main>
      <div class="eyebrow">Welcome to Clipsmines</div>
      <h1>Explore <span>movies.</span></h1>
      <p class="intro">Tap a movie poster to reveal its download button.</p>
      <section class="panel">
        <h2>Movies</h2>
        <div id="video-list" class="video-list"><p class="hint">Loading movies…</p></div>
      </section>
      <p class="note">Only download or share movies that you have the legal right to distribute.</p>
    </main>
    <footer>© <span id="year">2026</span> Clipsmines</footer>
  </div>
  <script>
    async function loadVideos() {
      const list = document.getElementById("video-list");
      try {
        const response = await fetch("./videos.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Catalogue unavailable");
        const videos = await response.json();
        list.replaceChildren();
        if (!Array.isArray(videos) || videos.length === 0) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = "No movies available right now.";
          list.appendChild(empty);
          return;
        }
        videos.forEach((video) => {
          const card = document.createElement("article");
          card.className = "video-card";
          const posterButton = document.createElement("button");
          posterButton.className = "poster-button";
          posterButton.type = "button";
          posterButton.setAttribute("aria-expanded", "false");
          posterButton.setAttribute("aria-label", "Show download button for " + (video.title || "movie"));
          const poster = document.createElement("img");
          poster.src = video.poster;
          poster.alt = (video.title || "Movie") + " poster";
          poster.loading = "lazy";
          posterButton.appendChild(poster);
          const title = document.createElement("h3");
          title.textContent = video.title || "Movie";
          const downloadWrap = document.createElement("div");
          downloadWrap.className = "download-wrap";
          const link = document.createElement("a");
          link.className = "cta";
          link.href = video.downloadUrl || "#";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Download";
          downloadWrap.appendChild(link);
          const hint = document.createElement("p");
          hint.className = "hint";
          hint.textContent = "Tap the poster to show the button";
          posterButton.addEventListener("click", () => {
            const open = downloadWrap.classList.toggle("is-visible");
            posterButton.setAttribute("aria-expanded", String(open));
            hint.textContent = open ? "Download button is ready" : "Tap the poster to show the button";
          });
          card.append(posterButton, title, downloadWrap, hint);
          list.appendChild(card);
        });
      } catch (error) {
        list.textContent = "Movie catalogue is temporarily unavailable. Please try again later.";
      }
    }
    loadVideos();
  </script>
</body>
</html>
