<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>ClipsMines — Movie catalogue</title>
  <meta name="description" content="Browse the ClipsMines movie catalogue.">
  <style>
    :root{color-scheme:dark;--gold:#e8bd58;--muted:#b7b1a4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#3a2b0d 0,transparent 48%),#090909;color:#f7f3e9;font-family:Arial,Helvetica,sans-serif}
    .wrap{width:min(960px,calc(100% - 32px));margin:auto}
    header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #ffffff18}
    .brand{font-size:20px;font-weight:800;letter-spacing:2px;color:var(--gold)}
    .tag{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
    main{padding:55px 0;text-align:center}
    .eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
    h1{margin:16px 0;font-size:clamp(36px,8vw,62px)}
    h1 span{color:var(--gold)}
    .intro{max-width:600px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.7}
    .panel{margin:36px auto 0;max-width:850px;padding:26px;border:1px solid #b98c354d;border-radius:18px;background:linear-gradient(145deg,#19150d,#101010 65%);box-shadow:0 18px 60px #0009}
    .panel h2{margin:0 0 22px;font-size:22px}
    .video-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
    .video-card{min-width:0;text-align:left}
    .poster-link{display:block;overflow:hidden;border:1px solid #ffffff25;border-radius:12px;background:#15120c}
    .poster-link img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;transition:transform .2s}
    .poster-link:hover img{transform:scale(1.035)}
    .video-card h3{margin:12px 0 6px;font-size:17px}
    .video-card p{margin:0;color:var(--muted);font-size:12px}
    .note{margin:22px auto 0;color:#918a7c;font-size:12px;line-height:1.6;max-width:650px}
    footer{padding:24px 0 32px;border-top:1px solid #ffffff18;color:#807a70;text-align:center;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand">CLIPSMINES</div><div class="tag">Movie catalogue</div></header>
    <main>
      <div class="eyebrow">Welcome to ClipsMines</div>
      <h1>Explore <span>movies.</span></h1>
      <p class="intro">Choose a movie poster to open its details and download page.</p>
      <section class="panel">
        <h2>Movies</h2>
        <div id="video-list" class="video-list"><p class="intro">Loading movies…</p></div>
      </section>
      <p class="note">Movies are listed only when distribution is permitted. Please check the licence and attribution on each movie page.</p>
    </main>
    <footer>© 2026 ClipsMines</footer>
  </div>
  <script>
    async function loadMovies(){
      const list=document.getElementById("video-list");
      try{
        const response=await fetch("./videos.json",{cache:"no-store"});
        if(!response.ok)throw new Error("Catalogue unavailable");
        const movies=await response.json();
        list.replaceChildren();
        if(!Array.isArray(movies)||!movies.length){list.textContent="No movies available right now.";return;}
        movies.forEach(movie=>{
          const card=document.createElement("article");card.className="video-card";
          const link=document.createElement("a");link.className="poster-link";link.href=movie.page||"movie.html";link.target="_blank";link.rel="noopener";
          const img=document.createElement("img");img.src=movie.poster;img.alt=(movie.title||"Movie")+" poster";img.loading="lazy";
          link.appendChild(img);
          const title=document.createElement("h3");title.textContent=movie.title||"Movie";
          const meta=document.createElement("p");meta.textContent=movie.year||"";
          card.append(link,title,meta);list.appendChild(card);
        });
      }catch(e){list.textContent="Movie catalogue is temporarily unavailable. Please try again later.";}
    }
    loadMovies();
  </script>
</body>
</html>
